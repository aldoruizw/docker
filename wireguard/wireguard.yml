#version: "3.8"
services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - SERVERURL=yourdns.duckdns.org
      - SERVERPORT=51820
      - PEERS=client1,client2 # Your clients
      - PEERDNS=10.8.1.3 # Pi-hole's internal IP address
      - INTERNAL_SUBNET=10.8.0.0/24
      - ALLOWEDIPS=0.0.0.0/0
    volumes:
      - /home/pi/container/wireguard/config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - 51820:51820/udp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped
    networks:
      vpn-net:
        ipv4_address: 10.8.1.2

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    environment:
      - WEBPASSWORD=pihole
      - FTLCONF_LOCAL_IPV4=10.8.1.3
    volumes:
      - /home/pi/container/pihole/etc/pihole:/etc/pihole
      - /home/pi/container/pihole/etc/dnsmasq.d:/etc/dnsmasq.d
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 31080:80/tcp
    restart: unless-stopped
    networks:
      vpn-net:
        ipv4_address: 10.8.1.3

networks:
  wireguard-pihole-network:
    ipam:
      config:
        - subnet: 10.8.1.0/24
